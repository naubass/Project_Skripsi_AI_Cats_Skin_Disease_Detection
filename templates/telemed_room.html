<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsultasi Video — Sakti Pet Care</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #1a1128; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    /* Video Lawan Bicara (Full Screen) */
    #remote-video { width: 100%; height: 100%; object-fit: cover; background: #0f0a18; }
    
    /* Video Kita (Kecil di Kanan Bawah) */
    #local-video { 
        position: absolute; bottom: 20px; right: 20px; 
        width: 130px; height: 180px; object-fit: cover; 
        border-radius: 16px; border: 2px solid #d4a843; 
        box-shadow: 0 8px 24px rgba(0,0,0,0.5); transform: scaleX(-1); 
    }
    
    /* Kontrol Panel */
    .controls { 
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
        display: flex; gap: 15px; background: rgba(255,255,255,0.1); 
        padding: 12px 24px; border-radius: 99px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
    }
    .ctrl-btn { 
        width: 52px; height: 52px; border-radius: 50%; border: none; 
        background: rgba(255,255,255,0.2); color: white; font-size: 22px; 
        cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.3); }
    .ctrl-btn.off { background: #e05252; }
    .ctrl-btn.end { background: #e05252; }
    
    #status { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: white; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>

  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted></video>
  
  <div id="status">🔴 Menunggu partisipan bergabung...</div>

  <div class="controls">
    <button class="ctrl-btn" id="btn-mic" onclick="toggleMic()" title="Mic">🎤</button>
    <button class="ctrl-btn" id="btn-cam" onclick="toggleCam()" title="Kamera">📹</button>
    <button class="ctrl-btn end" onclick="endCall()" title="Tutup">❌</button>
  </div>

<script>
  const roomId = "{{ room_id }}";
  // Bikin Client ID unik per tab browser
  const clientId = "{{ user.id }}_" + Math.random().toString(36).substring(2, 9);
  
  // Deteksi wss (jika deploy di HTTPS) atau ws (jika localhost)
  const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
  const wsUrl = `${wsProtocol}://${window.location.host}/ws/telemed/${roomId}/${clientId}`;
  
  let ws;
  let localStream;
  let peerConnection;
  
  // STUN Server Google untuk menembus NAT/Firewall
  const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  
  const localVid = document.getElementById('local-video');
  const remoteVid = document.getElementById('remote-video');
  const statusEl = document.getElementById('status');

  async function init() {
    try {
      // Minta izin kamera & mic
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVid.srcObject = localStream;
      
      // Connect ke Websocket Server FastAPI
      ws = new WebSocket(wsUrl);
      
      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        
        if (msg.type === 'peer_joined') {
          statusEl.textContent = "🟢 Terhubung";
          createPeer();
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          ws.send(JSON.stringify({ type: 'offer', offer }));
        } 
        else if (msg.type === 'offer') {
          statusEl.textContent = "🟢 Terhubung";
          if (!peerConnection) createPeer();
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: 'answer', answer }));
        } 
        else if (msg.type === 'answer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer));
        } 
        else if (msg.type === 'ice_candidate') {
          if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
        }
        else if (msg.type === 'peer_left') {
          statusEl.textContent = "🔴 Partisipan Keluar";
          remoteVid.srcObject = null; // Blank layar besar jika lawan mati
        }
      };
    } catch (err) { 
      alert("Kamera dan mikrofon wajib diizinkan untuk konsultasi!"); 
    }
  }

  function createPeer() {
    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
    
    // Tangkap video lawan bicara
    peerConnection.ontrack = e => { remoteVid.srcObject = e.streams[0]; };
    
    // Kirim rute jaringan kita ke lawan
    peerConnection.onicecandidate = e => {
      if (e.candidate) ws.send(JSON.stringify({ type: 'ice_candidate', candidate: e.candidate }));
    };
  }

  function toggleMic() {
    const track = localStream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    const btn = document.getElementById('btn-mic');
    btn.classList.toggle('off', !track.enabled);
    btn.textContent = track.enabled ? '🎤' : '🔇';
  }
  
  function toggleCam() {
    const track = localStream.getVideoTracks()[0];
    track.enabled = !track.enabled;
    document.getElementById('btn-cam').classList.toggle('off', !track.enabled);
  }

  function endCall() {
    if (ws) ws.close();
    if (peerConnection) peerConnection.close();
    localStream.getTracks().forEach(t => t.stop()); // Matikan lampu kamera
    window.close(); // Tutup tab browser
  }

  window.onload = init;
</script>
</body>
</html>
