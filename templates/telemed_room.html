<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Konsultasi Video — Sakti Pet Care</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #0b0914; margin: 0; overflow: hidden; height: 100vh; height: 100dvh; }
  </style>
</head>
<body class="relative w-screen h-[100dvh] flex justify-center items-center bg-[#0b0914] overflow-hidden">

  <!-- 1. Video Lawan Bicara (Full Screen Background) -->
  <video id="remote-video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover bg-[#130f1e]"></video>
  
  <!-- Indikator Status di Kiri Atas -->
  <div id="status" class="absolute top-4 left-4 z-20 bg-black/60 backdrop-blur-md text-white px-3 py-1.5 rounded-xl font-medium text-xs md:text-sm flex items-center gap-2 border border-white/10 shadow-lg">
    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse" id="status-dot"></span>
    <span id="status-text">Menunggu partisipan...</span>
  </div>

  <!-- 2. Video Kita (Kecil di Pojok Kanan Bawah) -->
  <div class="absolute bottom-20 right-4 z-20 w-32 h-44 md:w-48 md:h-64 rounded-2xl overflow-hidden border-2 border-[#d4a843]/60 shadow-2xl bg-gray-900 transition-all">
    <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover [transform:scaleX(-1)]"></video>
    <div class="absolute bottom-1.5 left-1.5 bg-black/50 backdrop-blur-sm text-white text-[10px] md:text-xs px-2 py-0.5 rounded font-medium">
      Anda
    </div>
  </div>
  
  <!-- 3. Panel Kontrol Bawah (Fixed & Aman di Mobile) -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 md:gap-3 bg-[#1a1528]/95 px-3 md:px-6 py-2.5 rounded-full backdrop-blur-xl border border-white/10 shadow-2xl">
    
    <!-- Tombol Mic -->
    <button id="mic-btn" onclick="toggleMic()" title="Mic" class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/10 hover:bg-white/20 text-white text-base md:text-lg flex items-center justify-center transition-all">
      🎤
    </button>
    
    <!-- Tombol Kamera -->
    <button id="cam-btn" onclick="toggleCam()" title="Kamera" class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/10 hover:bg-white/20 text-white text-base md:text-lg flex items-center justify-center transition-all">
      📹
    </button>

    <!-- TOMBOL AKHIRI KONSULTASI -->
    <button onclick="endRoom()" class="px-3 md:px-5 h-10 md:h-12 rounded-full bg-red-600 hover:bg-red-700 text-white font-semibold text-xs md:text-sm transition-all flex items-center gap-1.5 shadow-lg shadow-red-600/30 whitespace-nowrap">
      🛑 <span class="hidden sm:inline">Akhiri Sesi</span><span class="sm:hidden">Akhiri</span>
    </button>

    <!-- Tombol Keluar Tab -->
    <button onclick="window.close()" title="Tutup" class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white text-base md:text-lg flex items-center justify-center transition-all">
      ✕
    </button>
  </div>

<script>
  const roomId = "{{ room_id }}";
  const clientId = "{{ user.id }}_" + Math.random().toString(36).substring(2, 9);
  
  const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
  const wsUrl = `${wsProtocol}://${window.location.host}/ws/telemed/${roomId}/${clientId}`;
  
  let ws;
  let localStream;
  let peerConnection;
  
  const config = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      {
        urls: 'turn:{{ turn_host }}:{{ turn_port }}',
        username: '{{ turn_username }}',
        credential: '{{ turn_credential }}'
      }
    ]
  };
  
  const localVid = document.getElementById('local-video');
  const remoteVid = document.getElementById('remote-video');
  const statusEl = document.getElementById('status-text');
  const statusDot = document.getElementById('status-dot');

  async function init() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVid.srcObject = localStream;
      
      ws = new WebSocket(wsUrl);
      
      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        
        if (msg.type === 'peer_joined') {
          statusEl.textContent = "Terhubung";
          statusDot.className = "w-2.5 h-2.5 rounded-full bg-green-500 animate-none";
          createPeer();
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          ws.send(JSON.stringify({ type: 'offer', offer }));
        } 
        else if (msg.type === 'offer') {
          statusEl.textContent = "Terhubung";
          statusDot.className = "w-2.5 h-2.5 rounded-full bg-green-500 animate-none";
          if (!peerConnection) createPeer();
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: 'answer', answer }));
        } 
        else if (msg.type === 'answer') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer));
        } 
        else if (msg.type === 'ice_candidate') {
          if (peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
        }
        else if (msg.type === 'peer_left') {
          statusEl.textContent = "Partisipan Keluar";
          statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse";
          remoteVid.srcObject = null;
        }
      };
    } catch (err) { 
      alert("Kamera dan mikrofon wajib diizinkan untuk konsultasi!"); 
    }
  }

  function createPeer() {
    peerConnection = new RTCPeerConnection(config);
    localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
    
    peerConnection.ontrack = e => { remoteVid.srcObject = e.streams[0]; };
    
    peerConnection.onicecandidate = e => {
      if (e.candidate) ws.send(JSON.stringify({ type: 'ice_candidate', candidate: e.candidate }));
    };
  }

  function toggleMic() {
    const track = localStream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    const btn = document.getElementById('mic-btn');
    btn.classList.toggle('bg-red-500/30', !track.enabled);
    btn.textContent = track.enabled ? '🎤' : '🔇';
  }
  
  function toggleCam() {
    const track = localStream.getVideoTracks()[0];
    track.enabled = !track.enabled;
    const btn = document.getElementById('cam-btn');
    btn.classList.toggle('bg-red-500/30', !track.enabled);
    btn.textContent = track.enabled ? '📹' : '📵';
  }

  async function endRoom() {
    if (!confirm("Apakah Anda yakin ingin mengakhiri sesi konsultasi ini? Ruang akan ditutup untuk kedua pihak.")) return;
    
    try {
      const res = await fetch(`/api/telemed/${roomId}/end`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      
      if (res.ok) {
        alert("Sesi konsultasi berhasil diakhiri.");
        window.close();
      } else {
        alert("Gagal mengakhiri sesi.");
      }
    } catch (e) {
      console.error(e);
      alert("Terjadi kesalahan jaringan.");
    }
  }

  window.onload = init;
</script>
</body>
</html>
